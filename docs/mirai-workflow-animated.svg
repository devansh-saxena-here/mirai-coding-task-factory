<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 344" width="1120" height="344" role="img" aria-label="MIRAI 6-Stage Coding Task Factory Workflow">
  <title>MIRAI Workflow — 6-Stage Coding Task Factory</title>
  <style>
    :root {
      --bg: #f8fafc;
      --bg-border: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --title: #0b1f3a;
      --subtitle: #475569;
      --muted: #64748b;
      --pill-bg: #eff6ff;
      --pill-border: #bfdbfe;
      --pill-text: #1d4ed8;
      --repair-bg: #fffbeb;
      --repair-border: #fcd34d;
      --repair-text: #b45309;
      --arrow: #1a56db;
      --repair-arrow: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bg-border: #21262d;
        --card-bg: #161b22;
        --card-border: #30363d;
        --title: #f0f6fc;
        --subtitle: #c9d1d9;
        --muted: #8b949e;
        --pill-bg: #13233a;
        --pill-border: #1f4b8f;
        --pill-text: #79c0ff;
        --repair-bg: #271f0e;
        --repair-border: #9e6a03;
        --repair-text: #f2cc60;
        --arrow: #58a6ff;
        --repair-arrow: #f0883e;
      }
    }

    .frame {
      fill: var(--bg);
      stroke: var(--bg-border);
      stroke-width: 1.5;
    }

    .header-group {
      opacity: 0;
      animation: miraiHeaderFade 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .status-dot {
      fill: #16a34a;
      transform-origin: 40px 36px;
      animation: miraiPulseDot 2.4s ease-in-out infinite;
    }

    .status-ring {
      fill: none;
      stroke: #16a34a;
      stroke-width: 1.5;
      transform-origin: 40px 36px;
      animation: miraiPulseRing 2.4s ease-out infinite;
    }

    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      fill: var(--title);
    }

    .header-pill-bg {
      fill: var(--pill-bg);
      stroke: var(--pill-border);
      stroke-width: 1;
    }

    .header-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--pill-text);
    }

    .wf-card {
      opacity: 0;
      animation: miraiCardEnter 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), filter 0.28s ease;
    }

    .wf-card:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 8px 14px rgba(11, 31, 58, 0.12));
    }

    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.18s; }
    .d3 { animation-delay: 0.28s; }
    .d4 { animation-delay: 0.38s; }
    .d5 { animation-delay: 0.48s; }
    .d6 { animation-delay: 0.58s; }

    .card-rect {
      fill: var(--card-bg);
      stroke: var(--card-border);
      stroke-width: 1.25;
      transition: stroke 0.25s ease;
    }

    .wf-card:hover .card-rect {
      stroke: var(--arrow);
    }

    .stage-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }

    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--title);
    }

    .stage-line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: var(--subtitle);
    }

    .stage-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      fill: var(--muted);
    }

    .connector {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 4 4;
      animation: miraiFlowRight 1.1s linear infinite;
    }

    .connector-head {
      fill: var(--arrow);
    }

    .repair-group {
      opacity: 0;
      animation: miraiHeaderFade 0.7s ease 0.72s forwards;
    }

    .repair-arc {
      fill: none;
      stroke: var(--repair-arrow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 6 5;
      animation: miraiFlowRepair 1.6s linear infinite;
    }

    .repair-head {
      fill: var(--repair-arrow);
    }

    .repair-pill {
      fill: var(--repair-bg);
      stroke: var(--repair-border);
      stroke-width: 1;
    }

    .repair-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--repair-text);
    }

    .footer-note {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: var(--muted);
      opacity: 0;
      animation: miraiHeaderFade 0.65s ease 0.85s forwards;
    }

    @keyframes miraiHeaderFade {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes miraiCardEnter {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes miraiFlowRight {
      from { stroke-dashoffset: 16; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes miraiFlowRepair {
      from { stroke-dashoffset: 22; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes miraiPulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes miraiPulseRing {
      0% { transform: scale(1); opacity: 0.75; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .header-group, .wf-card, .repair-group, .footer-note {
        opacity: 1;
        animation: none;
      }
      .connector, .repair-arc, .status-dot, .status-ring {
        animation: none;
      }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1116" height="340" rx="16" class="frame" />

  <!-- Top Header Strip -->
  <g class="header-group">
    <circle cx="40" cy="36" r="4.5" class="status-ring" />
    <circle cx="40" cy="36" r="4.5" class="status-dot" />
    <text x="56" y="40" class="eyebrow">MIRAI WORKFLOW · 6-STAGE CODING TASK FACTORY</text>

    <rect x="786" y="22" width="304" height="26" rx="13" class="header-pill-bg" />
    <text x="938" y="39" text-anchor="middle" class="header-pill-text">5-Gate Isolated · Harbor 1.4 · Granular Eval</text>
  </g>

  <!-- Stage 01: Repo Intake -->
  <g class="wf-card d1">
    <rect x="30" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="30" y="74" width="160" height="5" rx="2.5" fill="#0B1F3A" />
    <rect x="44" y="92" width="34" height="20" rx="6" fill="#0B1F3A" />
    <text x="61" y="106" text-anchor="middle" class="stage-num">01</text>
    <text x="44" y="135" class="stage-title">Repo Intake</text>
    <text x="44" y="157" class="stage-line">GitHub SHA / ZIP</text>
    <text x="44" y="174" class="stage-line">SHA-256 Snapshot</text>
    <text x="44" y="212" class="stage-tag">/new-project</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="192" y1="152" x2="205" y2="152" class="connector" />
  <polygon points="203,147 210,152 203,157" class="connector-head" />

  <!-- Stage 02: Task Spec -->
  <g class="wf-card d2">
    <rect x="210" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="210" y="74" width="160" height="5" rx="2.5" fill="#1A56DB" />
    <rect x="224" y="92" width="34" height="20" rx="6" fill="#1A56DB" />
    <text x="241" y="106" text-anchor="middle" class="stage-num">02</text>
    <text x="224" y="135" class="stage-title">Task Spec</text>
    <text x="224" y="157" class="stage-line">Source-Grounded</text>
    <text x="224" y="174" class="stage-line">Acceptance Criteria</text>
    <text x="224" y="212" class="stage-tag">/task-generator</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="372" y1="152" x2="385" y2="152" class="connector" />
  <polygon points="383,147 390,152 383,157" class="connector-head" />

  <!-- Stage 03: Patch & Tests -->
  <g class="wf-card d3">
    <rect x="390" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="390" y="74" width="160" height="5" rx="2.5" fill="#0EA5E9" />
    <rect x="404" y="92" width="34" height="20" rx="6" fill="#0EA5E9" />
    <text x="421" y="106" text-anchor="middle" class="stage-num">03</text>
    <text x="404" y="135" class="stage-title">Patch &amp; Tests</text>
    <text x="404" y="157" class="stage-line">Reference Patch</text>
    <text x="404" y="174" class="stage-line">Traceable Suites</text>
    <text x="404" y="212" class="stage-tag">/solution · /test-suite</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="552" y1="152" x2="565" y2="152" class="connector" />
  <polygon points="563,147 570,152 563,157" class="connector-head" />

  <!-- Stage 04: 5-Gate Check -->
  <g class="wf-card d4">
    <rect x="570" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="570" y="74" width="160" height="5" rx="2.5" fill="#D97706" />
    <rect x="584" y="92" width="34" height="20" rx="6" fill="#D97706" />
    <text x="601" y="106" text-anchor="middle" class="stage-num">04</text>
    <text x="584" y="135" class="stage-title">5-Gate Check</text>
    <text x="584" y="157" class="stage-line">Isolated Sandbox</text>
    <text x="584" y="174" class="stage-line">1-Click Auto-Repair</text>
    <text x="584" y="212" class="stage-tag">/validation</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <line x1="732" y1="152" x2="745" y2="152" class="connector" />
  <polygon points="743,147 750,152 743,157" class="connector-head" />

  <!-- Stage 05: Harbor Export -->
  <g class="wf-card d5">
    <rect x="750" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="750" y="74" width="160" height="5" rx="2.5" fill="#16A34A" />
    <rect x="764" y="92" width="34" height="20" rx="6" fill="#16A34A" />
    <text x="781" y="106" text-anchor="middle" class="stage-num">05</text>
    <text x="764" y="135" class="stage-title">Harbor 1.4</text>
    <text x="764" y="157" class="stage-line">Oracle &amp; Verifier</text>
    <text x="764" y="174" class="stage-line">Reproducible ZIP</text>
    <text x="764" y="212" class="stage-tag">/export</text>
  </g>

  <!-- Connector 5 -> 6 -->
  <line x1="912" y1="152" x2="925" y2="152" class="connector" />
  <polygon points="923,147 930,152 923,157" class="connector-head" />

  <!-- Stage 06: Agent Eval -->
  <g class="wf-card d6">
    <rect x="930" y="74" width="160" height="156" rx="12" class="card-rect" />
    <rect x="930" y="74" width="160" height="5" rx="2.5" fill="#7C3AED" />
    <rect x="944" y="92" width="34" height="20" rx="6" fill="#7C3AED" />
    <text x="961" y="106" text-anchor="middle" class="stage-num">06</text>
    <text x="944" y="135" class="stage-title">Agent Eval</text>
    <text x="944" y="157" class="stage-line">Gemini · GPT · Qwen</text>
    <text x="944" y="174" class="stage-line">Granular Leaderboard</text>
    <text x="944" y="212" class="stage-tag">/evaluation · /leaderboard</text>
  </g>

  <!-- Self-Healing Auto-Repair Feedback Arc (Stage 04 -> Stage 03) -->
  <g class="repair-group">
    <path d="M 650 232 C 650 282, 470 282, 470 238" class="repair-arc" />
    <polygon points="465,241 470,231 475,241" class="repair-head" />
    <rect x="444" y="264" width="232" height="24" rx="12" class="repair-pill" />
    <text x="560" y="280" text-anchor="middle" class="repair-text">AI Auto-Repair Loop (from real stderr)</text>
  </g>

  <!-- Footer Summary -->
  <text x="560" y="324" text-anchor="middle" class="footer-note">
    Immutable Starting Point  ·  Real Sandbox Execution  ·  Protected-Test Guard  ·  Per-Test Partial Scoring
  </text>
</svg>
