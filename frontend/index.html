<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/mirai-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIRAI turns real repositories into reproducible coding tasks with reference solutions, traceable tests, isolated validation, and AI agent evaluation." />
    <meta property="og:title" content="MIRAI — Real repositories. Measurable AI." />
    <meta property="og:description" content="MIRAI turns real repositories into reproducible coding tasks with reference solutions, traceable tests, isolated validation, and AI agent evaluation." />
    <meta name="theme-color" content="#08254a" />
    <title>MIRAI — Real repositories. Measurable AI.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mirai.theme.v2');
          var dark = saved === 'dark';
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
